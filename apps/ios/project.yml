# Generate the Xcode project with:  cd apps/ios && xcodegen generate
name: NJScratch
options:
  bundleIdPrefix: com.madramdesign
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "3"
    DEVELOPMENT_TEAM: G2E45NC5BZ
    CODE_SIGN_STYLE: Automatic
targets:
  NJScratch:
    type: application
    platform: iOS
    sources:
      - path: NJScratch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.madramdesign.NJScratch
        PRODUCT_NAME: NJScratch
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: NJ Scratch
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.reference
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    info:
      path: NJScratch/Resources/Info.plist
      properties:
        # Only lets the app reach a dev server on this Mac (localhost); all real data is HTTPS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Background app refresh for starred-game notifications (Notifier.refreshTaskId).
        BGTaskSchedulerPermittedIdentifiers:
          - com.madramdesign.NJScratch.refresh
        UIBackgroundModes:
          - fetch
  NJScratchTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NJScratchTests
    dependencies:
      - target: NJScratch
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.madramdesign.NJScratchTests
schemes:
  NJScratch:
    build:
      targets:
        NJScratch: all
        NJScratchTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NJScratchTests
